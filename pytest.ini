[pytest]
# Pytest configuration for Azure HayMaker Engineering Simulation Tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Addopts - default options for pytest
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=azure_haymaker.engineering_sim
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (complete workflows)
    slow: Slow-running tests
    requires_github_api: Tests requiring real GitHub API access
    asyncio: Async tests using asyncio

# Async test configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = azure_haymaker.engineering_sim
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
