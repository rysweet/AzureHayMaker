# Azure HayMaker Documentation Site
# GitHub Pages configuration using Just the Docs theme

title: Azure HayMaker
description: >-
  Orchestration service that simulates realistic Azure tenant activity
  by deploying and managing 50+ distinct operational scenarios using
  autonomous goal-seeking agents.
baseurl: "/AzureHayMaker"
url: "https://rysweet.github.io"

# Theme configuration
remote_theme: just-the-docs/just-the-docs@v0.10.0

# Color scheme (supports: light, dark)
color_scheme: light

# Enable dark mode toggle
color_scheme_toggle:
  - light
  - dark

# Logo in the header
logo: "/assets/images/azure-haymaker-logo.svg"

# Enable or disable the site search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Heading anchor links
heading_anchors: true

# Aux links in the upper right navigation
aux_links:
  "View on GitHub": "https://github.com/rysweet/AzureHayMaker"

# External navigation links
aux_links_new_tab: true

# Sort order for navigation links
nav_sort: case_insensitive

# Footer content
footer_content: >-
  Copyright &copy; 2025 Azure HayMaker Project.
  Distributed under the <a href="https://github.com/rysweet/AzureHayMaker/blob/main/LICENSE">MIT license</a>.
  <br>
  <a href="https://github.com/rysweet/AzureHayMaker">View source on GitHub</a>

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer last edited timestamp
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Callouts for documentation
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Collections for organizing documentation
collections:
  scenarios:
    permalink: "/:collection/:path/"
    output: true

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Exclude files from build
exclude:
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - presentations/*.pptx

# Include files in build
include:
  - _config.yml

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# GitHub metadata
repository: rysweet/AzureHayMaker

# Mermaid diagrams support
mermaid:
  version: "10.6.0"

# Enable copy button for code blocks
enable_copy_code_button: true

# Defaults for pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "scenarios"
      type: "pages"
    values:
      layout: "default"
      parent: "Scenarios"
  - scope:
      path: "architecture"
      type: "pages"
    values:
      layout: "default"
      parent: "Architecture"
  - scope:
      path: "reference"
      type: "pages"
    values:
      layout: "default"
      parent: "Reference"
  - scope:
      path: "deployment"
      type: "pages"
    values:
      layout: "default"
      parent: "Deployment"
