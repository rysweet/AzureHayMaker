# Limerick Email Deployment
#
# Fun deployment that generates all emails as limericks!
# Use with: haymaker kw deploy --config-file limerick-deployment.yaml

name: limerick-deployment

total_workers: 10
duration_hours: 2
tenant_domain: contoso.onmicrosoft.com

departments:
  operations:
    count: 10
    endpoint_type: cli_container
    activity:
      email_per_hour: 4
      teams_messages_per_hour: 10
      documents_per_day: 2
      meetings_per_day: 3

email_markers_enabled: true
marker_format: LIMERICK
marker_style: subject

email_generation:
  enabled: true
  directive: |
    Write all emails as limericks about office work.
    Each email should be exactly 5 lines following AABBA rhyme scheme.
    Be creative and humorous while remaining professional.
    Topics should relate to the subject line provided.
  provider: anthropic
