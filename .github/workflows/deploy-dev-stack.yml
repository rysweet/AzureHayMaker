name: Deploy Developer Stack

# Developer-specific deployment workflow using OIDC authentication
# Triggered via CLI with credentials from local .env file
# Each developer gets their own isolated HayMaker stack
#
# OIDC: No secrets needed! Azure trusts GitHub Actions tokens directly.
# Just provide tenant/subscription/client IDs from your .env file.
#
# Usage:
#   ./scripts/trigger_deploy.sh --name myprefix --watch

on:
  workflow_dispatch:
    inputs:
      naming_prefix:
        description: 'Naming prefix for resources (e.g., your username)'
        required: true
        type: string
      environment:
        description: 'Environment (dev/staging/prod)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      location:
        description: 'Azure region'
        required: false
        default: 'westus2'
        type: string
      simulation_size:
        description: 'Simulation size'
        required: false
        default: 'small'
        type: choice
        options:
          - small
          - medium
          - large
      skip_image_build:
        description: 'Skip Docker image build'
        required: false
        default: false
        type: boolean
      # Azure credentials - uses OIDC, no secrets needed!
      azure_tenant_id:
        description: 'Azure Tenant ID (from .env)'
        required: false
        type: string
      azure_subscription_id:
        description: 'Azure Subscription ID (from .env)'
        required: false
        type: string
      azure_client_id:
        description: 'Azure Client ID - SP with OIDC federated credential (from .env)'
        required: false
        type: string

env:
  NAMING_PREFIX: ${{ inputs.naming_prefix }}
  ENVIRONMENT: ${{ inputs.environment }}
  LOCATION: ${{ inputs.location }}
  SIMULATION_SIZE: ${{ inputs.simulation_size }}
  # Use inputs if provided, otherwise fall back to repository secrets
  AZURE_TENANT_ID: ${{ inputs.azure_tenant_id || secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CLIENT_ID: ${{ inputs.azure_client_id || secrets.AZURE_CLIENT_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest
    outputs:
      resource_group: ${{ steps.names.outputs.resource_group }}
      acr_name: ${{ steps.names.outputs.acr_name }}
      cae_name: ${{ steps.names.outputs.cae_name }}
      orchestrator_name: ${{ steps.names.outputs.orchestrator_name }}
      unique_suffix: ${{ steps.names.outputs.unique_suffix }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate Resource Names
        id: names
        run: |
          PREFIX="${{ inputs.naming_prefix }}"
          ENV="${{ inputs.environment }}"
          
          # Generate a short unique suffix from subscription ID for global uniqueness
          # This ensures ACR names are globally unique while still being predictable per-subscription
          SUB_HASH=$(echo "${{ env.AZURE_SUBSCRIPTION_ID }}" | md5sum | cut -c1-6)
          
          # Generate consistent resource names with unique suffix
          RG="haymaker-${PREFIX}-${ENV}-rg"
          # ACR must be globally unique - include subscription hash
          ACR="hm${PREFIX}${ENV}${SUB_HASH}"
          # ACR must be alphanumeric, 5-50 chars, lowercase
          ACR=$(echo "$ACR" | tr -cd '[:alnum:]' | cut -c1-50 | tr '[:upper:]' '[:lower:]')
          CAE="haymaker-${PREFIX}-${ENV}-cae"
          ORCH="hm-${PREFIX}-orch"
          # Container app names max 32 chars
          ORCH=$(echo "$ORCH" | cut -c1-32)
          
          echo "resource_group=$RG" >> $GITHUB_OUTPUT
          echo "acr_name=$ACR" >> $GITHUB_OUTPUT
          echo "cae_name=$CAE" >> $GITHUB_OUTPUT
          echo "orchestrator_name=$ORCH" >> $GITHUB_OUTPUT
          echo "unique_suffix=$SUB_HASH" >> $GITHUB_OUTPUT
          
          echo "📦 Resource Names:"
          echo "  Resource Group: $RG"
          echo "  ACR: $ACR (globally unique)"
          echo "  Container App Env: $CAE"
          echo "  Orchestrator: $ORCH"
          echo "  Unique Suffix: $SUB_HASH"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep Templates
        run: |
          az bicep build --file infra/bicep/main-containerapps.bicep
          echo "✅ Bicep templates validated"

  create-acr:
    name: Create Container Registry
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      acr_login_server: ${{ steps.acr.outputs.login_server }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          RG="${{ needs.setup.outputs.resource_group }}"
          
          # Check if RG is being deleted and wait
          for i in {1..30}; do
            RG_STATE=$(az group show --name "$RG" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
            
            if [ "$RG_STATE" = "Deleting" ]; then
              echo "⏳ Resource group is being deleted, waiting... (attempt $i/30)"
              sleep 10
            elif [ "$RG_STATE" = "Succeeded" ]; then
              echo "✅ Resource group already exists and ready: $RG"
              exit 0
            else
              # RG doesn't exist or in other state, try to create
              break
            fi
          done
          
          # Create the resource group
          echo "Creating resource group: $RG"
          az group create --name "$RG" --location "${{ inputs.location }}" \
            --tags Environment="${{ inputs.environment }}" \
                   Owner="${{ inputs.naming_prefix }}" \
                   ManagedBy="deploy-dev-stack" \
            || {
              # If create fails, it might have just finished deleting - retry once
              echo "First attempt failed, retrying in 10s..."
              sleep 10
              az group create --name "$RG" --location "${{ inputs.location }}" \
                --tags Environment="${{ inputs.environment }}" \
                       Owner="${{ inputs.naming_prefix }}" \
                       ManagedBy="deploy-dev-stack"
            }
          echo "✅ Resource group ready: $RG"

      - name: Create ACR
        id: acr
        run: |
          ACR="${{ needs.setup.outputs.acr_name }}"
          RG="${{ needs.setup.outputs.resource_group }}"
          
          # Check if ACR exists (could be in this RG or globally)
          if az acr show --name "$ACR" &> /dev/null; then
            # ACR exists - check if it's in our RG
            ACR_RG=$(az acr show --name "$ACR" --query "resourceGroup" -o tsv 2>/dev/null || echo "")
            if [ "$ACR_RG" = "$RG" ]; then
              echo "✅ ACR already exists in this resource group: $ACR"
            else
              echo "⚠️ ACR $ACR exists in different resource group: $ACR_RG"
              echo "This is a naming conflict - each developer should use a unique prefix"
              exit 1
            fi
          else
            echo "Creating ACR: $ACR..."
            az acr create \
              --name "$ACR" \
              --resource-group "$RG" \
              --sku Basic \
              --admin-enabled true
            echo "✅ ACR created: $ACR"
          fi
          
          LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "ACR Login Server: $LOGIN_SERVER"

  build-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [setup, create-acr]
    if: ${{ inputs.skip_image_build != true }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name "${{ needs.setup.outputs.acr_name }}"

      - name: Build and Push Image
        run: |
          ACR_SERVER="${{ needs.create-acr.outputs.acr_login_server }}"
          IMAGE_TAG="${{ github.sha }}"
          
          cd src
          docker build -f Dockerfile.orchestrator \
            -t "${ACR_SERVER}/haymaker-orchestrator:latest" \
            -t "${ACR_SERVER}/haymaker-orchestrator:${IMAGE_TAG}" \
            .
          
          docker push "${ACR_SERVER}/haymaker-orchestrator:latest"
          docker push "${ACR_SERVER}/haymaker-orchestrator:${IMAGE_TAG}"
          
          echo "✅ Image pushed: ${ACR_SERVER}/haymaker-orchestrator:latest"

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [setup, create-acr, build-image]
    if: always() && needs.setup.result == 'success' && needs.create-acr.result == 'success'
    outputs:
      orchestrator_fqdn: ${{ steps.deploy.outputs.fqdn }}
      key_vault_name: ${{ steps.deploy.outputs.keyvault }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get SP Object ID
        id: sp
        run: |
          SP_OID=$(az ad sp show --id "${{ inputs.azure_client_id }}" --query id -o tsv)
          echo "object_id=$SP_OID" >> $GITHUB_OUTPUT

      - name: Get ACR Password
        id: acr_creds
        run: |
          ACR="${{ needs.setup.outputs.acr_name }}"
          RG="${{ needs.setup.outputs.resource_group }}"
          PASSWORD=$(az acr credential show --name "$ACR" --resource-group "$RG" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Deploy Bicep
        id: deploy
        continue-on-error: true  # Container App may fail initially due to ACR permissions
        run: |
          RG="${{ needs.setup.outputs.resource_group }}"
          ACR_SERVER="${{ needs.create-acr.outputs.acr_login_server }}"
          DEPLOYMENT_NAME="dev-stack-$(date +%s)"
          
          echo "🚀 Deploying infrastructure to $RG..."
          echo "Note: Initial deployment may fail at revision provisioning (ACR pull permission)."
          echo "We'll grant permission and restart the revision afterward."
          
          OUTPUTS=$(az deployment group create \
            --resource-group "$RG" \
            --template-file infra/bicep/main-containerapps.bicep \
            --parameters environment="${{ inputs.environment }}" \
                         adminObjectIds="['${{ steps.sp.outputs.object_id }}']" \
                         githubOidcClientId="${{ env.AZURE_CLIENT_ID }}" \
                         simulationSize="${{ inputs.simulation_size }}" \
                         orchestratorImage="${ACR_SERVER}/haymaker-orchestrator:latest" \
                         acrPassword="${{ steps.acr_creds.outputs.password }}" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs -o json 2>/dev/null || echo "{}")
          
          # If deployment failed, still try to get outputs from partial deployment
          if [ -z "$OUTPUTS" ] || [ "$OUTPUTS" = "{}" ]; then
            echo "⚠️  Deployment had errors (expected - waiting for ACR permission)"
            echo "Fetching outputs from deployed resources..."
            OUTPUTS=$(az deployment group show \
              --resource-group "$RG" \
              --name "$DEPLOYMENT_NAME" \
              --query properties.outputs -o json 2>/dev/null || echo "{}")
          fi
          
          FQDN=$(echo "$OUTPUTS" | jq -r '.orchestratorFqdn.value // ""')
          KV=$(echo "$OUTPUTS" | jq -r '.keyVaultName.value // ""')
          ORCH="${{ needs.setup.outputs.orchestrator_name }}"
          
          # If FQDN not in outputs, try to get it directly
          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            FQDN=$(az containerapp show --name "$ORCH" --resource-group "$RG" \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
          fi
          
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "keyvault=$KV" >> $GITHUB_OUTPUT
          echo "orchestrator=$ORCH" >> $GITHUB_OUTPUT
          
          echo "✅ Infrastructure deployment initiated"
          echo "  FQDN: $FQDN"
          echo "  Key Vault: $KV"

  configure-permissions:
    name: Configure Permissions
    runs-on: ubuntu-latest
    needs: [setup, create-acr, deploy-infrastructure]
    if: always() && needs.setup.result == 'success' && needs.create-acr.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Grant ACR Pull Permission
        run: |
          RG="${{ needs.setup.outputs.resource_group }}"
          ORCH="${{ needs.setup.outputs.orchestrator_name }}"
          ACR="${{ needs.setup.outputs.acr_name }}"
          
          echo "Getting orchestrator managed identity..."
          PRINCIPAL_ID=$(az containerapp show --name "$ORCH" --resource-group "$RG" \
            --query "identity.principalId" -o tsv 2>/dev/null || echo "")
          
          if [ -n "$PRINCIPAL_ID" ]; then
            echo "Principal ID: $PRINCIPAL_ID"
            ACR_ID=$(az acr show --name "$ACR" --resource-group "$RG" --query id -o tsv)
            az role assignment create \
              --assignee "$PRINCIPAL_ID" \
              --role AcrPull \
              --scope "$ACR_ID" || echo "Role may already exist"
            echo "✅ ACR pull permission granted"
          else
            echo "⚠️ Container app not found or has no managed identity"
          fi

      - name: Grant Key Vault Permission
        run: |
          RG="${{ needs.setup.outputs.resource_group }}"
          ORCH="${{ needs.setup.outputs.orchestrator_name }}"
          KV="${{ needs.deploy-infrastructure.outputs.key_vault_name }}"
          
          PRINCIPAL_ID=$(az containerapp show --name "$ORCH" --resource-group "$RG" \
            --query "identity.principalId" -o tsv 2>/dev/null || echo "")
          
          if [ -n "$PRINCIPAL_ID" ] && [ -n "$KV" ] && [ "$KV" != "null" ]; then
            KV_ID=$(az keyvault show --name "$KV" --resource-group "$RG" --query id -o tsv)
            az role assignment create \
              --assignee "$PRINCIPAL_ID" \
              --role "Key Vault Secrets User" \
              --scope "$KV_ID" || echo "Role may already exist"
            echo "✅ Key Vault permission granted"
          fi

      - name: Wait for RBAC and Restart Revision
        run: |
          RG="${{ needs.setup.outputs.resource_group }}"
          ORCH="${{ needs.setup.outputs.orchestrator_name }}"
          
          echo "Waiting 60s for RBAC propagation..."
          sleep 60
          
          echo "Restarting container app to retry image pull with new permissions..."
          REVISION=$(az containerapp revision list --name "$ORCH" --resource-group "$RG" \
            --query "[0].name" -o tsv 2>/dev/null || echo "")
          
          if [ -n "$REVISION" ]; then
            az containerapp revision restart --name "$ORCH" --resource-group "$RG" \
              --revision "$REVISION" 2>/dev/null || echo "Revision restart attempted"
            echo "✅ Revision restart initiated"
          else
            echo "⚠️ No revision found to restart"
          fi
          
          # Wait for revision to become ready
          echo "Waiting 30s for revision to start..."
          sleep 30

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [setup, create-acr, deploy-infrastructure, configure-permissions]
    if: always() && needs.setup.result == 'success' && needs.create-acr.result == 'success'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get Orchestrator FQDN
        id: get_fqdn
        run: |
          RG="${{ needs.setup.outputs.resource_group }}"
          ORCH="${{ needs.setup.outputs.orchestrator_name }}"
          
          # Try to get FQDN from the container app
          FQDN=$(az containerapp show --name "$ORCH" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
          
          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            # Try alternate query
            FQDN=$(az containerapp show --name "$ORCH" --resource-group "$RG" \
              --query "properties.latestRevisionFqdn" -o tsv 2>/dev/null || echo "")
          fi
          
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "Orchestrator FQDN: $FQDN"

      - name: Wait for Container Startup
        run: |
          echo "Waiting 90s for container to start and become healthy..."
          sleep 90

      - name: Health Check
        run: |
          FQDN="${{ steps.get_fqdn.outputs.fqdn }}"
          
          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            echo "⚠️ Could not determine orchestrator URL"
            echo "Check Azure Portal for Container App status"
            exit 0  # Don't fail the workflow
          fi
          
          URL="https://${FQDN}"
          echo "Testing: $URL"
          
          for i in {1..10}; do
            if curl -sf "$URL/" > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              curl -s "$URL/" | jq . || curl -s "$URL/"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 15s..."
            sleep 15
          done
          
          echo "⚠️ Health check did not pass within timeout"
          echo "Container may still be starting - check Azure Portal"
          echo "URL: $URL"

      - name: Deployment Summary
        run: |
          FQDN="${{ steps.get_fqdn.outputs.fqdn }}"
          echo "========================================="
          echo "🏴‍☠️ Developer Stack Deployment Complete!"
          echo "========================================="
          echo ""
          echo "Owner: ${{ inputs.naming_prefix }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Region: ${{ inputs.location }}"
          echo ""
          echo "Resources:"
          echo "  Resource Group: ${{ needs.setup.outputs.resource_group }}"
          echo "  ACR: ${{ needs.setup.outputs.acr_name }}"
          echo "  Orchestrator: ${{ needs.setup.outputs.orchestrator_name }}"
          echo ""
          echo "URLs:"
          echo "  Orchestrator: https://${FQDN}"
          echo ""
          echo "Test Commands:"
          echo "  curl https://${{ needs.deploy-infrastructure.outputs.orchestrator_fqdn }}/"
          echo "  curl https://${{ needs.deploy-infrastructure.outputs.orchestrator_fqdn }}/api/scenarios"
          echo ""
          echo "Cleanup:"
          echo "  az group delete --name ${{ needs.setup.outputs.resource_group }} --yes"
